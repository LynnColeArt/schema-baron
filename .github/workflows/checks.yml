name: Workspace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: node scripts/release/acquire-output.mjs
      - run: npm run native:verify
      # Unit/integration includes real browser consumers; install before verify.
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run verify
        env:
          SCHEMA_BARON_LINT_BASE: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
          SCHEMA_BARON_PARITY_EVIDENCE: ${{ runner.temp }}/schema-baron-${{ github.run_id }}-${{ github.run_attempt }}/parity
          SCHEMA_BARON_RECOVERY_EVIDENCE: ${{ runner.temp }}/schema-baron-${{ github.run_id }}-${{ github.run_attempt }}/recovery
          SCHEMA_BARON_MIGRATION_EVIDENCE: ${{ runner.temp }}/schema-baron-${{ github.run_id }}-${{ github.run_attempt }}/migration
      - run: npm audit --audit-level=low
      - run: node --test scripts/acceptance/evidence.test.ts scripts/acceptance/report.test.ts
      # Serialized legacy studies plus two fresh author -> independent consumer cycles.
      # Missing/stale portability handoff remains a hard failure.
      - run: node scripts/acceptance/run.mjs browser
      - name: Retain sanitized verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/evidence/verification/schema-baron-final-*/**/*.json
          if-no-files-found: error
          include-hidden-files: false
